<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">René Kuhm — Software Engineering</title>
  <desc id="description">Developer tooling, AI-assisted delivery and reproducible infrastructure from Eduardo Castex, Argentina.</desc>

  <defs>
    <radialGradient id="background" cx="20%" cy="30%" r="95%">
      <stop offset="0" stop-color="#111c33" />
      <stop offset="0.55" stop-color="#0a0f1c" />
      <stop offset="1" stop-color="#050810" />
    </radialGradient>
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.2" />
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#c4b5fd" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff" />
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.15" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35" />
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="22" /></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)" />
    <rect width="1200" height="360" fill="url(#grid)" />
    <ellipse cx="180" cy="120" rx="430" ry="260" fill="url(#cyan-glow)" />
    <ellipse cx="1050" cy="280" rx="440" ry="280" fill="url(#violet-glow)" />

    <g transform="translate(66 61)">
      <rect width="54" height="54" rx="13" fill="#0d1526" stroke="#334155" />
      <text x="27" y="35" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="800" fill="#00d9ff">RK</text>
    </g>

    <text x="66" y="188" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800" letter-spacing="-2.5" fill="url(#name)">René Kuhm</text>
    <rect x="66" y="210" width="590" height="3" rx="1.5" fill="url(#line)" />

    <text x="66" y="258" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="650" fill="#e2e8f0">Software Engineering · Developer Tooling</text>
    <text x="66" y="300" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#a5b4fc">AI-assisted Delivery · Reproducible Infrastructure</text>
    <text x="66" y="335" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" letter-spacing="0.5" fill="#94a3b8">Eduardo Castex · La Pampa · Argentina</text>

    <g transform="translate(890 80)" fill="none" stroke-linecap="round">
      <circle cx="120" cy="100" r="92" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 8" />
      <circle cx="120" cy="100" r="61" stroke="#334155" stroke-width="1.5" />
      <path d="M42 100h156M120 22v156" stroke="#1e3a5f" stroke-width="1" />
      <path d="M67 153 120 100l50-49" stroke="url(#line)" stroke-width="3" />
      <circle cx="67" cy="153" r="8" fill="#0a0f1c" stroke="#00d9ff" stroke-width="3" />
      <circle cx="120" cy="100" r="13" fill="#0a0f1c" stroke="#c4b5fd" stroke-width="3" />
      <circle cx="170" cy="51" r="8" fill="#0a0f1c" stroke="#a78bfa" stroke-width="3" />
      <circle cx="120" cy="100" r="29" fill="url(#violet-glow)" stroke="none" />
    </g>

    <path d="M1110 294h24v-24M90 28H66v24" fill="none" stroke="#334155" stroke-width="2" />
    <rect x="0.5" y="0.5" width="1199" height="359" rx="21.5" fill="none" stroke="#263244" />
  </g>
</svg>
