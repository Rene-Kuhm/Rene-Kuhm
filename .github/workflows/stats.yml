name: stats

# Regenerates assets/stats.svg and commits it when the numbers move.
#
# The card is a file in this repository on purpose. Pointing the README at
# a hosted card service makes the profile depend on someone else's uptime,
# and when that service is down the first thing a visitor sees is a broken
# image. This job can fail without the profile ever noticing: the last good
# SVG stays committed.

on:
  schedule:
    # Mondays, 06:00 UTC. The numbers move slowly; running more often would
    # only add commits.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/generate-stats.mjs
      - .github/workflows/stats.yml

concurrency:
  group: stats
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Generate the card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-stats.mjs

      # main requires a pull request and enforces it on admins too, so the
      # job cannot push straight to it. It keeps a single long-lived branch
      # instead and reuses the same PR, which avoids a pile of stale ones.
      - name: Open or update the refresh PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- assets/stats.svg; then
            echo "numbers unchanged; nothing to do"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/stats
          git add assets/stats.svg
          git commit -m "chore(stats): refresh the activity card"
          git push --force origin chore/stats

          if [ -n "$(gh pr list --head chore/stats --state open --json number --jq '.[].number')" ]; then
            echo "PR already open; the force push updated it"
            exit 0
          fi

          # Opening the PR needs "Allow GitHub Actions to create and approve
          # pull requests", which is off by default. The refreshed card is
          # already pushed either way, so a missing PR is not a failure: say
          # where to find it and leave the run green.
          if ! gh pr create \
                --base main \
                --head chore/stats \
                --title "chore(stats): refresh the activity card" \
                --body "Numbers moved. Generated by the \`stats\` workflow from the GitHub API; no hand edits."
          then
            echo "::notice::Could not open the PR automatically. The refreshed card is on chore/stats: ${{ github.server_url }}/${{ github.repository }}/compare/main...chore/stats"
          fi
